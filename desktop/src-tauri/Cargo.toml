[package]
name = "aethercam-desktop"
version = "2.1.0"
description = "AetherCam Professional High-Performance Virtual Camera Desktop Server"
authors = ["AetherCam Open Source Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
byteorder = "1.5"
rusqlite = { version = "0.31", features = ["bundled"] }
ring = "0.17"
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
lazy_static = "1.4"
chrono = "0.4"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security"
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
