<!-- AetherCam app icon - 256x256 SVG source for ICO generation -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#003d5c"/>
      <stop offset="100%" stop-color="#001a2e"/>
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Camera body -->
  <rect x="40" y="72" width="176" height="128" rx="16" fill="#00d4ff" opacity="0.95"/>

  <!-- Viewfinder notch -->
  <rect x="96" y="52" width="64" height="24" rx="8" fill="#00d4ff" opacity="0.95"/>

  <!-- Main lens ring -->
  <circle cx="128" cy="136" r="52" fill="#0d1b2a"/>

  <!-- Lens glass -->
  <circle cx="128" cy="136" r="44" fill="url(#lens)"/>

  <!-- Iris -->
  <circle cx="128" cy="136" r="32" fill="#00d4ff"/>

  <!-- Pupil -->
  <circle cx="128" cy="136" r="20" fill="#0d1b2a"/>

  <!-- Catchlight -->
  <circle cx="118" cy="126" r="6" fill="white" opacity="0.7"/>
  <circle cx="136" cy="142" r="3" fill="white" opacity="0.4"/>

  <!-- Flash LED -->
  <circle cx="192" cy="96" r="10" fill="#ffd700"/>
  <circle cx="192" cy="96" r="6"  fill="#fff8e1"/>

  <!-- WiFi arc bottom-left (streaming indicator) -->
  <circle cx="72" cy="184" r="4" fill="white" opacity="0.9"/>
  <path d="M60,178 Q72,168 84,178" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M54,172 Q72,158 90,172" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
